<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Rei da Betoneira</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.tela {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
}

.tela.ativa {
    display: flex;
}

.foto {
    width: min(88vw, 430px);
    max-height: 58vh;
    object-fit: contain;
    border-radius: 18px;
    display: block;
    box-shadow: 0 10px 35px rgba(0,0,0,.6);
}

h1 {
    color: white;
    font-size: clamp(24px, 7vw, 40px);
    line-height: 1.15;
    margin: 25px 0;
    font-weight: 900;
}

.botoes {
    display: flex;
    gap: 15px;
    justify-content: center;
    align-items: center;
    width: 100%;
}

button {
    border: 0;
    border-radius: 14px;
    padding: 16px 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

#sim {
    background: #16a34a;
    color: white;
}

#nao {
    background: #dc2626;
    color: white;
    position: relative;
}

.final {
    color: white;
    font-size: clamp(25px, 7vw, 42px);
    font-weight: 900;
    line-height: 1.15;
    max-width: 700px;
}

@media (max-width: 500px) {
    .foto {
        width: 92vw;
        max-height: 52vh;
    }

    h1 {
        margin: 20px 0;
    }

    button {
        padding: 15px 25px;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<!-- TELA 1 -->
<section id="tela1" class="tela ativa">
    <img id="foto1" class="foto" alt="Foto">
    
    <h1>VAMOS PARA A FESTA,<br>REI DA BETONEIRA?</h1>

    <div class="botoes">
        <button id="sim" onclick="proximaTela()">SIM</button>
        <button id="nao">NÃO</button>
    </div>
</section>

<!-- TELA 2 -->
<section id="tela2" class="tela">
    <img id="foto2" class="foto" alt="Foto">

    <h1>AÍ SIM GATÃO,<br>PAROU DE PAGAR DE MÁQUINA!</h1>

    <button onclick="ultimaTela()">CONTINUAR</button>
</section>

<!-- TELA 3 -->
<section id="tela3" class="tela">
    <img id="foto3" class="foto" alt="Foto">

    <div class="final">
        RESPONDA SEUS AMIGOS AGORA, GATÃO.<br><br>
        PARA DE SE FAZER DE MICROONDAS.
    </div>
</section>

<script>
/*
  COLOQUE AS 3 FOTOS NA RAIZ DO PROJETO
  com estes nomes:

  foto1.jpg
  foto2.jpg
  foto3.jpg
*/

document.getElementById("foto1").src = "foto1.jpg";
document.getElementById("foto2").src = "foto2.jpg";
document.getElementById("foto3").src = "foto3.jpg";

function mostrar(id) {
    document.querySelectorAll(".tela").forEach(function(tela) {
        tela.classList.remove("ativa");
    });

    document.getElementById(id).classList.add("ativa");
}

function proximaTela() {
    mostrar("tela2");
}

function ultimaTela() {
    mostrar("tela3");
}

/* Botão NÃO foge */
var botaoNao = document.getElementById("nao");

function fugir() {
    var x = Math.random() * 180 - 90;
    var y = Math.random() * 120 - 60;

    botaoNao.style.transform =
        "translate(" + x + "px," + y + "px)";
}

botaoNao.addEventListener("mouseenter", fugir);
botaoNao.addEventListener("touchstart", function(e) {
    e.preventDefault();
    fugir();
});
botaoNao.addEventListener("click", fugir);
</script>

</body>
</html>
