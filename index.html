<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rei da Betoneira</title>

<style>
html,body{
margin:0;
width:100%;
min-height:100%;
font-family:Arial,sans-serif;
background:#111;
color:#fff
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.box{
width:min(92vw,430px);
text-align:center;
padding:18px
}

img{
width:100%;
max-height:58vh;
object-fit:cover;
border-radius:18px;
display:block
}

h1{
font-size:29px;
line-height:1.15;
margin:18px 0
}

p{
font-size:21px;
font-weight:800;
line-height:1.35
}

button{
border:0;
border-radius:14px;
padding:16px 26px;
font-size:20px;
font-weight:bold;
margin:6px;
cursor:pointer;
touch-action:manipulation
}

.sim{
background:#22c55e;
color:#06130a
}

.nao{
background:#eee;
color:#111
}

.partiu{
background:#f59e0b;
color:#111;
width:90%
}

.hidden{
display:none
}
</style>
</head>

<body>

<div class="box">

<div id="tela1">

<img src="data:image/jpeg;base64,REPLACE_FOTO_1">

<h1>VAMOS PARA A FESTA,<br>REI DA BETONEIRA?</h1>

<button class="sim" onclick="tela2()">SIM</button>
<button class="nao" id="nao">NÃO</button>

</div>

<div id="tela2" class="hidden">

<img src="data:image/jpeg;base64,REPLACE_FOTO_2">

<h1>AÍ SIM GATÃO,<br>PAROU DE PAGAR DE MÁQUINA!</h1>

<button class="partiu" onclick="tela3()">CONTINUAR</button>

</div>

<div id="tela3" class="hidden">

<img src="data:image/jpeg;base64,REPLACE_FOTO_3">

<p>
RESPONDA SEUS AMIGOS AGORA, GATÃO.<br><br>
PARA DE SE FAZER DE MICROONDAS.
</p>

</div>

</div>

<script>
function tela2(){
document.getElementById("tela1").classList.add("hidden");
document.getElementById("tela2").classList.remove("hidden");
}

function tela3(){
document.getElementById("tela2").classList.add("hidden");
document.getElementById("tela3").classList.remove("hidden");
}

const nao=document.getElementById("nao");

function fugir(){
const x=Math.random()*180-90;
const y=Math.random()*120-60;
nao.style.transform="translate("+x+"px,"+y+"px)";
}

nao.addEventListener("mouseenter",fugir);
nao.addEventListener("touchstart",function(e){
e.preventDefault();
fugir();
});
nao.addEventListener("click",fugir);
</script>

</body>
</html>
